<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Now</title>
  <style>
    :root {
      --bg: #eef3f8;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #66768a;
      --accent: #2f6fdf;
      --border: #dbe3ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10161d;
        --card: #1a232d;
        --text: #e6edf4;
        --muted: #93a3b5;
        --accent: #6ea2ff;
        --border: #2a3643;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }
    button {
      padding: 10px 14px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .place { color: var(--muted); margin: 0 0 8px; }
    .now { display: flex; align-items: center; gap: 16px; }
    .icon { font-size: 3.5rem; line-height: 1; }
    .temp { font-size: 3rem; font-weight: 600; }
    .desc { color: var(--muted); }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
      font-size: 0.9rem;
    }
    .stats span { display: block; color: var(--muted); font-size: 0.8rem; }
    .forecast {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 8px;
      text-align: center;
    }
    .day { font-size: 0.9rem; }
    .day .icon { font-size: 1.6rem; margin: 4px 0; }
    .day .lo { color: var(--muted); }
    .status { color: var(--muted); }
    .error { color: #d14343; }
  </style>
</head>
<body>
  <main>
    <h1>Weather Now</h1>

    <form id="search">
      <input id="city" placeholder="Search a city…" autocomplete="off">
      <button type="submit">Go</button>
      <button type="button" class="secondary" id="locate" title="Use my location">📍</button>
    </form>

    <p id="status" class="status">Finding your location…</p>

    <section id="current" class="card" hidden>
      <p class="place" id="place"></p>
      <div class="now">
        <div class="icon" id="icon"></div>
        <div>
          <div class="temp" id="temp"></div>
          <div class="desc" id="desc"></div>
        </div>
      </div>
      <div class="stats">
        <div><span>Feels like</span><b id="feels"></b></div>
        <div><span>Humidity</span><b id="humidity"></b></div>
        <div><span>Wind</span><b id="wind"></b></div>
      </div>
    </section>

    <section id="week" class="card forecast" hidden></section>
  </main>

  <script>
    // Free API, no key needed: https://open-meteo.com
    const CODES = {
      0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
      45: ["Fog", "🌫️"], 48: ["Rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
      61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "🌨️"],
      80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Violent showers", "⛈️"],
      85: ["Snow showers", "🌨️"], 86: ["Snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm, hail", "⛈️"], 99: ["Thunderstorm, hail", "⛈️"],
    };
    const describe = code => CODES[code] || ["Unknown", "🌡️"];
    const $ = id => document.getElementById(id);

    function setStatus(msg, isError = false) {
      $("status").textContent = msg;
      $("status").className = isError ? "status error" : "status";
      $("status").hidden = !msg;
    }

    async function loadWeather(lat, lon, placeName) {
      setStatus("Loading weather…");
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
          `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
          `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Weather service error");
        const data = await res.json();
        render(data, placeName);
        setStatus("");
      } catch (e) {
        setStatus("Couldn't load the weather. Please try again.", true);
      }
    }

    function render(data, placeName) {
      const c = data.current;
      const [text, icon] = describe(c.weather_code);
      $("place").textContent = placeName;
      $("icon").textContent = icon;
      $("temp").textContent = `${Math.round(c.temperature_2m)}°C`;
      $("desc").textContent = text;
      $("feels").textContent = `${Math.round(c.apparent_temperature)}°C`;
      $("humidity").textContent = `${c.relative_humidity_2m}%`;
      $("wind").textContent = `${Math.round(c.wind_speed_10m)} km/h`;
      $("current").hidden = false;

      const d = data.daily;
      $("week").innerHTML = d.time.map((date, i) => {
        const day = i === 0 ? "Today" :
          new Date(date + "T12:00").toLocaleDateString(undefined, { weekday: "short" });
        return `<div class="day">
          <div>${day}</div>
          <div class="icon">${describe(d.weather_code[i])[1]}</div>
          <div><b>${Math.round(d.temperature_2m_max[i])}°</b> <span class="lo">${Math.round(d.temperature_2m_min[i])}°</span></div>
        </div>`;
      }).join("");
      $("week").hidden = false;
    }

    async function searchCity(name) {
      setStatus(`Searching for “${name}”…`);
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(name)}`);
        const data = await res.json();
        const r = data.results && data.results[0];
        if (!r) return setStatus(`No place found for “${name}”.`, true);
        const label = [r.name, r.admin1, r.country].filter(Boolean).join(", ");
        loadWeather(r.latitude, r.longitude, label);
      } catch (e) {
        setStatus("Search failed. Please try again.", true);
      }
    }

    function useMyLocation() {
      if (!navigator.geolocation) return searchCity("London");
      setStatus("Finding your location…");
      navigator.geolocation.getCurrentPosition(
        pos => loadWeather(pos.coords.latitude, pos.coords.longitude, "Your location"),
        () => {
          setStatus("Location unavailable — showing London. Search for your city above.");
          searchCity("London");
        },
        { timeout: 8000 }
      );
    }

    $("search").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("city").value.trim();
      if (name) searchCity(name);
    });
    $("locate").addEventListener("click", useMyLocation);

    useMyLocation();
  </script>
</body>
</html>
